<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Notepad with Location Reminders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
            min-height: 500px;
            position: relative;
            overflow: hidden;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .mode-toggle {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            border-radius: 12px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        .mode-toggle:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .notepad-view, .todo-view {
            padding: 20px;
            min-height: 400px;
        }

        .notepad-area {
            width: 100%;
            min-height: 350px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            resize: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .notepad-area:focus {
            outline: none;
            border-color: #667eea;
        }

        .todo-view {
            display: none;
        }

        .todo-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .add-todo-input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .add-todo-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .location-input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            display: none;
        }

        .location-input.show {
            display: block;
        }

        .location-input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .location-btn {
            background: #4CAF50;
            color: white;
            padding: 10px;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .location-btn:hover {
            background: #45a049;
        }

        .location-btn.active {
            animation: pulse 1.5s infinite;
            background: #ff9800;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(255, 152, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 152, 0, 0);
            }
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease;
            transition: all 0.3s;
        }

        .todo-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .todo-content {
            flex: 1;
        }

        .todo-text {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .location-tag {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            margin-top: 5px;
        }

        .distance-tag {
            display: inline-block;
            background: #fff3e0;
            color: #f57c00;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            margin-left: 5px;
        }

        .todo-actions {
            display: flex;
            gap: 5px;
        }

        .todo-actions button {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .complete-btn {
            background: #4CAF50;
            color: white;
        }

        .delete-btn {
            background: #f44336;
            color: white;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 20px;
            min-width: 300px;
            max-width: 400px;
            z-index: 1000;
            animation: slideInRight 0.5s ease;
            display: none;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.show {
            display: block;
        }

        .notification-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 600;
            color: #333;
        }

        .notification-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .notification-content {
            margin-bottom: 15px;
            color: #666;
        }

        .notification-actions {
            display: flex;
            gap: 10px;
        }

        .notification-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .ok-btn {
            background: #4CAF50;
            color: white;
        }

        .snooze-btn {
            background: #ff9800;
            color: white;
        }

        .status-bar {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            background: rgba(0,0,0,0.05);
            border-radius: 20px;
            font-size: 12px;
            color: #666;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .loading-indicator {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            z-index: 2000;
        }

        .loading-indicator.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="modeTitle">📝 Notepad</h1>
            <button class="mode-toggle" onclick="toggleMode()">📋 To-Do List</button>
        </div>

        <div class="notepad-view" id="notepadView">
            <textarea class="notepad-area" id="notepadContent" placeholder="Start typing your notes here..."></textarea>
        </div>

        <div class="todo-view" id="todoView">
            <div class="todo-controls">
                <input type="text" class="add-todo-input" id="todoInput" placeholder="Add a new task...">
                <input type="text" class="location-input" id="locationInput" placeholder="Enter location (e.g., Chennai, Coimbatore)">
                <button class="btn location-btn" id="locationBtn" onclick="toggleLocationInput()" title="Add location reminder">
                    📍
                </button>
                <button class="btn btn-primary" onclick="addTodo()">Add Task</button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
        </div>

        <div class="status-bar">
            <div class="status-indicator"></div>
            <span id="locationStatus">Initializing...</span>
        </div>
    </div>

    <div class="notification" id="notification">
        <div class="notification-header">
            <div class="notification-icon">📍</div>
            <span>Location Reminder!</span>
        </div>
        <div class="notification-content" id="notificationContent">
            You've arrived at your destination.
        </div>
        <div class="notification-actions">
            <button class="ok-btn" onclick="markComplete()">✓ Complete</button>
            <button class="snooze-btn" onclick="snoozeReminder()">⏰ Snooze</button>
        </div>
    </div>

    <div class="loading-indicator" id="loadingIndicator">
        🔄 Processing...
    </div>

    <script>
        // API Configuration
        const GEOCODE_API_KEY = '510856ca4c3849649dbecd5940387839';
        const REVERSE_GEOCODE_API_KEY = 'de514c9e21e541f18a230a47f6fd82e0';
        const PROXIMITY_THRESHOLD = 500; // meters

        let currentMode = 'notepad';
        let todos = [];
        let isLocationInputVisible = false;
        let currentTodoId = null;
        let watchId = null;
        let snoozedReminders = new Set();
        let currentPosition = null;
        let notifiedTodos = new Set();

        function toggleMode() {
            const notepadView = document.getElementById('notepadView');
            const todoView = document.getElementById('todoView');
            const modeTitle = document.getElementById('modeTitle');
            const modeToggle = document.querySelector('.mode-toggle');

            if (currentMode === 'notepad') {
                notepadView.style.display = 'none';
                todoView.style.display = 'block';
                modeTitle.textContent = '📋 To-Do List';
                modeToggle.textContent = '📝 Notepad';
                currentMode = 'todo';
                startLocationTracking();
            } else {
                notepadView.style.display = 'block';
                todoView.style.display = 'none';
                modeTitle.textContent = '📝 Notepad';
                modeToggle.textContent = '📋 To-Do List';
                currentMode = 'notepad';
            }
        }

        function toggleLocationInput() {
            const locationInput = document.getElementById('locationInput');
            const locationBtn = document.getElementById('locationBtn');
            
            isLocationInputVisible = !isLocationInputVisible;
            
            if (isLocationInputVisible) {
                locationInput.classList.add('show');
                locationBtn.classList.add('active');
                locationInput.focus();
            } else {
                locationInput.classList.remove('show');
                locationBtn.classList.remove('active');
                locationInput.value = '';
            }
        }

        async function geocodeLocation(locationName) {
            try {
                showLoading();
                const encodedLocation = encodeURIComponent(locationName);
                const url = `https://api.geoapify.com/v1/geocode/search?text=${encodedLocation}&apiKey=${GEOCODE_API_KEY}`;
                
                const response = await fetch(url, {
                    headers: { 'Accept': 'application/json' }
                });
                
                const data = await response.json();
                hideLoading();
                
                if (data.features && data.features.length > 0) {
                    const coords = data.features[0].geometry.coordinates;
                    return {
                        lat: coords[1],
                        lng: coords[0],
                        formatted: data.features[0].properties.formatted
                    };
                }
                return null;
            } catch (error) {
                hideLoading();
                console.error('Geocoding error:', error);
                return null;
            }
        }

        async function addTodo() {
            const input = document.getElementById('todoInput');
            const locationInput = document.getElementById('locationInput');
            const text = input.value.trim();
            const locationText = locationInput.value.trim();
            
            if (text) {
                const todo = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    location: null,
                    locationCoords: null,
                    locationName: null,
                    createdAt: new Date()
                };
                
                if (locationText) {
                    const coords = await geocodeLocation(locationText);
                    if (coords) {
                        todo.location = locationText;
                        todo.locationCoords = { lat: coords.lat, lng: coords.lng };
                        todo.locationName = coords.formatted;
                        alert(`✓ Location reminder set for: ${coords.formatted}`);
                    } else {
                        alert('❌ Location not found. Please try a different location name.');
                        return;
                    }
                }
                
                todos.push(todo);
                input.value = '';
                locationInput.value = '';
                toggleLocationInput();
                renderTodos();
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth's radius in meters
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; // Distance in meters
        }

        function formatDistance(meters) {
            if (meters < 1000) {
                return `${Math.round(meters)}m away`;
            } else {
                return `${(meters / 1000).toFixed(1)}km away`;
            }
        }

        function renderTodos() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            
            todos.forEach(todo => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                
                let distanceInfo = '';
                if (todo.locationCoords && currentPosition) {
                    const distance = calculateDistance(
                        currentPosition.lat,
                        currentPosition.lng,
                        todo.locationCoords.lat,
                        todo.locationCoords.lng
                    );
                    distanceInfo = `<span class="distance-tag">${formatDistance(distance)}</span>`;
                }
                
                li.innerHTML = `
                    <div class="todo-content">
                        <div class="todo-text">${todo.text}</div>
                        ${todo.location ? `<span class="location-tag">📍 ${todo.location}</span>${distanceInfo}` : ''}
                    </div>
                    <div class="todo-actions">
                        <button class="complete-btn" onclick="toggleComplete(${todo.id})">
                            ${todo.completed ? '↩' : '✓'}
                        </button>
                        <button class="delete-btn" onclick="deleteTodo(${todo.id})">✕</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function toggleComplete(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                if (todo.completed) {
                    notifiedTodos.add(id);
                }
                renderTodos();
            }
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            notifiedTodos.delete(id);
            snoozedReminders.delete(id);
            renderTodos();
        }

        function startLocationTracking() {
            if ("geolocation" in navigator) {
                document.getElementById('locationStatus').textContent = 'Getting location...';
                
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        currentPosition = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        
                        document.getElementById('locationStatus').textContent = 
                            `Tracking active (±${Math.round(position.coords.accuracy)}m)`;
                        
                        checkProximityToLocations();
                        renderTodos();
                    },
                    (error) => {
                        console.error('Location error:', error);
                        document.getElementById('locationStatus').textContent = 
                            'Location unavailable';
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 10000,
                        timeout: 5000
                    }
                );
            } else {
                document.getElementById('locationStatus').textContent = 'Location not supported';
            }
        }

        function checkProximityToLocations() {
            if (!currentPosition) return;
            
            todos.forEach(todo => {
                if (todo.locationCoords && 
                    !todo.completed && 
                    !snoozedReminders.has(todo.id) &&
                    !notifiedTodos.has(todo.id)) {
                    
                    const distance = calculateDistance(
                        currentPosition.lat,
                        currentPosition.lng,
                        todo.locationCoords.lat,
                        todo.locationCoords.lng
                    );
                    
                    if (distance <= PROXIMITY_THRESHOLD) {
                        showLocationNotification(todo, distance);
                        notifiedTodos.add(todo.id);
                    }
                }
            });
        }

        function showLocationNotification(todo, distance) {
            currentTodoId = todo.id;
            const notification = document.getElementById('notification');
            const content = document.getElementById('notificationContent');
            
            content.innerHTML = `
                <strong>📍 You're near ${todo.location}!</strong><br>
                <small>Distance: ${formatDistance(distance)}</small><br><br>
                <strong>Task:</strong> ${todo.text}
            `;
            
            notification.classList.add('show');
            
            // Vibrate if supported
            if ('vibrate' in navigator) {
                navigator.vibrate([200, 100, 200, 100, 200]);
            }
            
            // Browser notification
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('Location Reminder!', {
                    body: `You're near ${todo.location}. Task: ${todo.text}`,
                    icon: '📍',
                    tag: `todo-${todo.id}`
                });
            }
        }

        function markComplete() {
            if (currentTodoId) {
                toggleComplete(currentTodoId);
                hideNotification();
            }
        }

        function snoozeReminder() {
            if (currentTodoId) {
                snoozedReminders.add(currentTodoId);
                notifiedTodos.delete(currentTodoId);
                hideNotification();
                
                // Remind again after 10 minutes
                setTimeout(() => {
                    snoozedReminders.delete(currentTodoId);
                }, 600000);
            }
        }

        function hideNotification() {
            const notification = document.getElementById('notification');
            notification.classList.remove('show');
            currentTodoId = null;
        }

        function showLoading() {
            document.getElementById('loadingIndicator').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').classList.remove('show');
        }

        // Request notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Enter key to add todo
        document.getElementById('todoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        document.getElementById('locationInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        // Initialize
        window.addEventListener('load', function() {
            renderTodos();
            document.getElementById('locationStatus').textContent = 'Switch to To-Do mode';
        });
    </script>
</body>
</html>
